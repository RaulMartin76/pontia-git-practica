name: Demo Manual Workflow

on:
  workflow_dispatch:
    inputs:
      mensaje:
        description: "Mensaje de texto a imprimir por consola"
        required: true
        default: "Hola desde GitHub Actions!"
        type: string

jobs:
  imprimir-mensaje:
    runs-on: ubuntu-latest
    steps:
      - name: Imprimir mensaje por consola
        run: echo "Mensaje recibido: ${{ inputs.mensaje }}"
